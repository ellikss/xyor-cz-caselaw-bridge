name: XYOR CZ quality probe

on:
  push:
    paths:
      - '.github/workflows/quality-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe CZCDC text quality and similarity trap
        shell: python
        run: |
          import json
          import urllib.parse
          import urllib.request

          HF = 'https://datasets-server.huggingface.co/rows'
          DATASET = 'overthelex/cz-court-decisions'
          BRIDGE = 'https://xyor-cz-caselaw-bridge.onrender.com'

          def get_json(url, timeout=60):
              req = urllib.request.Request(url, headers={'User-Agent':'XYOR-CZ-probe/1.0'})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.load(r)

          def quality(text):
              text = text or ''
              replacement = text.count('\ufffd')
              markers = {m: text.count(m) for m in ('Ã','Å','Ä','Â') if text.count(m)}
              marker_total = sum(markers.values())
              suspect = replacement > 0 or marker_total >= 3
              return {
                  'replacement_char_count': replacement,
                  'mojibake_markers': markers,
                  'suspect': suspect,
              }

          print('=== CZCDC QUALITY PROBE ===', flush=True)
          found = None
          for offset in (0, 1, 2, 10, 100, 1000, 5000, 10000):
              q = urllib.parse.urlencode({
                  'dataset': DATASET,
                  'config': 'czcdc',
                  'split': 'train',
                  'offset': offset,
                  'length': 1,
              })
              try:
                  data = get_json(HF + '?' + q, 45)
                  item = (data.get('rows') or [{}])[0]
                  row = item.get('row') or {}
                  text = row.get('full_text') or ''
                  ql = quality(text)
                  print('CZCDC_ROW', json.dumps({
                      'row_idx': offset,
                      'case_number': row.get('case_number'),
                      'court_name': row.get('court_name'),
                      'decision_date': row.get('decision_date'),
                      'chars': len(text),
                      'quality': ql,
                      'prefix': text[:500],
                  }, ensure_ascii=False), flush=True)
                  if ql['suspect'] and found is None:
                      found = {
                          'row_idx': offset,
                          'case_number': row.get('case_number'),
                          'court_name': row.get('court_name'),
                          'decision_date': row.get('decision_date'),
                          'quality': ql,
                          'prefix': text[:900],
                      }
              except Exception as e:
                  print('CZCDC_ERR', offset, repr(e), flush=True)

          print('CZCDC_CORRUPTION_FIXTURE', json.dumps(found, ensure_ascii=False), flush=True)
          print('CZCDC_QUOTE_GATE_EXPECTED', 'BLOCK' if found else 'NO_SUSPECT_IN_SAMPLE', flush=True)

          print('=== SIMILARITY TRAP PROBE ===', flush=True)
          query = urllib.parse.urlencode({'config':'justice','q':'výpověď nájmu bytu','limit':5})
          try:
              data = get_json(BRIDGE + '/candidates?' + query, 90)
              candidates = data.get('candidates') or []
              print('SIMILARITY_CANDIDATES', json.dumps(candidates, ensure_ascii=False), flush=True)
              compact = []
              for c in candidates[:5]:
                  compact.append({
                      'row_idx': c.get('row_idx'),
                      'case_number': c.get('case_number'),
                      'court_name': c.get('court_name'),
                      'decision_date': c.get('decision_date'),
                      'subject': c.get('subject'),
                      'score': c.get('_score'),
                      'cited_provisions': c.get('cited_provisions'),
                  })
              print('SIMILARITY_COMPACT', json.dumps(compact, ensure_ascii=False), flush=True)
              if len(compact) >= 2:
                  same_score = compact[0].get('score') == compact[1].get('score')
                  different_court = compact[0].get('court_name') != compact[1].get('court_name')
                  different_provisions = compact[0].get('cited_provisions') != compact[1].get('cited_provisions')
                  print('SIMILARITY_TRAP_FACTS', json.dumps({
                      'same_score': same_score,
                      'different_court': different_court,
                      'different_provisions': different_provisions,
                      'rule': 'candidate similarity is navigation only; authority/applicability must be checked from source text and procedural posture',
                  }, ensure_ascii=False), flush=True)
          except Exception as e:
              print('SIMILARITY_ERR', repr(e), flush=True)
